# Dynamic prompt for the "Medications on Admission" pipeline.
# Same task and template as few-shot, but examples are selected at RUNTIME
# from the annotated dev pool -- e.g. the notes most similar to the input
# (same cluster, or nearest by embedding). Selected examples are rendered
# with example_template and injected into {examples}.
# Placeholders filled at runtime: {expected_template}, {examples}, {note_text}.

# Pool of annotated dev examples to select from (never from the test split).
# Each entry: note_id, cluster, text, medications.
examples_pool_file: "prompts/admission/few_shot_examples.json"

# How many examples to select per input note.
n_examples: 2

# Selection strategy, resolved in Python (this key documents the choice):
#   "same_cluster"  -> examples from the input note's cluster
#   "nearest"       -> k nearest dev notes by embedding similarity
selection_strategy: "same_cluster"

expected_template: |
    {
        "note_id": "string note_null",
        "medication_on_admission_text": "string | null",
        "start": "string | null",
        "end": "string | null",
        "medications": [
            {
                "span_text": "string | null",
                "start": "int | null",
                "end": "int | null",
                "attributes": {
                    "Active Substance": "string | null",
                    "Commercial Name": "string | null",
                    "Dosage Form": "string | null",
                    "Dose": "string | null",
                    "Posology/Dosing Regimen": "string | null",
                    "Prescribing Physician": "string | null"
                }
            }
        ]
    }

# Template used to render each selected example before injection.
example_template: |
  ### Example {index}

  Clinical note:
  {input}

  Output:
  {output}

prompt: |
  # Dynamic few-shot task

  Extract all medications listed in the **"Medications on Admission"** section
  of the clinical note below. The note is a full discharge summary -- locate
  the admission medication section yourself and ignore every other section
  (including "Discharge Medications").

  For each medication, return the verbatim span and its structured attributes.
  Do not add any text outside the extractions.

  ## Expected output

  For each medication found, produce one extraction whose text is the
  **verbatim span** of that medication line, and whose attributes follow this
  exact JSON object:

  {expected_template}

  Rules:

  - Every key must always be present. Use `null` (not `""`, not `"N/A"`) when
    the value is not stated in the text.
  - If **all seven attribute values are null** for an extraction, output the
    object as `null`.
  - Do not invent values. Only fill a field if the information is written in
    the note.
  - Keep the extracted span text exactly as it appears in the source (same
    casing, punctuation and spacing) so it can be aligned to character offsets.

  ## Examples

  {examples}

  ## Clinical note

  {note_text}