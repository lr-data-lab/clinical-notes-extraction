[project]
name = "clinical-notes-extraction"
version = "0.1.0"
description = "Structured extraction of Admission Medication and Discharge Medication from MIMIC discharge notes using local LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "db-dtypes>=1.5.1",
    "dotenv>=0.9.9",
    "google-cloud-bigquery>=3.41.0",
    "google-cloud-bigquery-storage>=2.39.0",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pyarrow>=24.0.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.6.0",
    "tqdm>=4.67.3",
]
authors = [{ name = "Luís Ramoa" }]

[project.scripts]
clinical-notes-extraction = "clinical_notes_extraction:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
]
