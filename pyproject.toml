[project]
name = "clinical-notes-extraction"
version = "0.1.0"
description = "Structured extraction from MIMIC clinical notes using local LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "db-dtypes>=1.5.1",
    "google-cloud-bigquery>=3.41.0",
    "pyarrow>=24.0.0",
]
authors = [{ name = "Luís Ramoa" }]

[project.scripts]
clinical-notes-extraction = "clinical_notes_extraction:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
